name: selftest
on:
  push:
    paths: [".github/workflows/selftest.yml"]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Teste ntfy e checagem
        env:
          GITHUB_ACTIONS: "true"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          echo "segredo cadastrado: ${{ secrets.NTFY_TOPIC != '' }}"
          echo "tamanho do topico: ${#NTFY_TOPIC}"
          python monitor.py --test-notify
          python monitor.py --once
