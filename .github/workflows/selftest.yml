name: selftest
on:
  push:
    paths: [".github/workflows/selftest.yml"]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostico ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          echo "segredo cadastrado: ${{ secrets.NTFY_TOPIC != '' }}"
          echo "tamanho: ${#NTFY_TOPIC}"
          echo "tem espaco/quebra: $(printf %s "$NTFY_TOPIC" | grep -c '[[:space:]]')"
          echo "hash do segredo: $(printf %s "$NTFY_TOPIC" | sha256sum | cut -c1-12)  (sugerido: 29135481ad16)"
          echo "caracteres fora do padrao (posicao: bytes):"
          python3 -c "import os;t=os.environ['NTFY_TOPIC'];[print(i, c.encode().hex(), hex(ord(c))) for i,c in enumerate(t) if not (c.isascii() and (c.isalnum() or c in '-_'))]"
          python3 -c "import os,re;t=os.environ['NTFY_TOPIC'];c=re.sub(r'[^A-Za-z0-9_-]','',t);print('limpo tem', len(c), 'caracteres; igual ao sugerido:', c=='duo-nyc-7q4m9x')"
