name: iPhone Duo watch

# Roda o monitor na nuvem, sem precisar de computador, das 07:00 as 22:00 de Nova York.
# O horario exato e controlado pelo proprio monitor (active_hours no config, com horario de verao).
# O agendamento (UTC) cobre a janela; cada execucao dura ate ~5h45 e a proxima
# comeca assim que a anterior termina (concurrency sem cancelamento).
on:
  schedule:
    - cron: "*/15 11-23,0-3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/watch.yml", "monitor.py", "config.example.json"]

concurrency:
  group: iphone-duo-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Monitorar (1 checagem por minuto)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANNOUNCE_START: ${{ github.event_name != 'schedule' && '1' || '0' }}
          PYTHONUNBUFFERED: "1"
        run: python monitor.py --duration-minutes 345
