name: iPhone Duo watch

# Roda o monitor na nuvem, sem precisar de computador, das 07:00 as 22:00 de Nova York.
# O horario exato e controlado pelo proprio monitor (active_hours no config, com horario de verao);
# fora da janela ele fica aguardando em vez de encerrar.
# Cada execucao dura ate ~5h45 e, ao terminar, dispara a proxima sozinha (passo "Religar").
# O agendamento abaixo e so uma rede de seguranca: o GitHub dispara cron de forma irregular.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/watch.yml", "monitor.py", "config.example.json"]

concurrency:
  group: iphone-duo-watch-v2
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Monitorar (1 checagem por minuto)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANNOUNCE_START: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.triggering_actor != 'github-actions[bot]')) && '1' || '0' }}
          PYTHONUNBUFFERED: "1"
        run: python monitor.py --duration-minutes 345
      - name: Religar (proximo ciclo)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Se o ciclo falhou rapido, espera um pouco para nao entrar em loop
          if [ "${{ job.status }}" != "success" ]; then sleep 120; fi
          gh workflow run "${{ github.workflow }}" --ref main -R "${{ github.repository }}"
